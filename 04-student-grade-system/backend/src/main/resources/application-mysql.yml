# ============================================================
#  MySQL 配置（可选）
#  启动方式：java -jar app.jar --spring.profiles.active=mysql
#  前提：已执行 db/schema-mysql.sql 与 db/data-mysql.sql
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_grade_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # MySQL 模式下不执行 H2 的初始化脚本
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false
